name: Deploy

# Manual only: builds the infrastructure from prodpai_cloud with an image that
# CD already pushed to ECR, then updates and feeds the dashboard EC2.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (empty = the selected branch's commit SHA)"
        type: string
        default: ""

permissions:
  contents: read

# Same group as destroy.yml, so apply and destroy never run at the same time.
concurrency:
  group: prodpai-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INFRA_REPO: nuntawatrdd/prodpai_cloud
  INFRA_REF: apps
  DASHBOARD_NAME: prodpai-dashboard
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  deploy:
    name: Deploy infrastructure and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # this repo, for .github/config.env and the scripts in .github/scripts
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared config
        run: grep -E '^[A-Z_]+=' .github/config.env | tr -d '\r' >> "$GITHUB_ENV"

      - name: Checkout prodpai_cloud
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          ref: ${{ env.INFRA_REF }}
          path: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check image exists in ECR
        run: |
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::$ECR_REPOSITORY:$IMAGE_TAG is not in ECR (wait for CD to push it)"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          # raw stdout, so `terraform output -json` can be piped to curl
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var="image_tag=$IMAGE_TAG"

      - name: Start dashboard instance
        id: dash
        run: bash .github/scripts/dashboard/start-instance.sh

      - name: Update dashboard code
        env:
          IID: ${{ steps.dash.outputs.id }}
        run: bash .github/scripts/dashboard/update-code.sh

      - name: Send Terraform output to dashboard
        working-directory: infra
        env:
          IP: ${{ steps.dash.outputs.ip }}
          TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: bash ../.github/scripts/dashboard/push-output.sh
