name: CI

# Single-app repository: every push is about this app, so no path filters.
# CI only tests, scans and builds the image; it never touches AWS.
# On main, the built image is handed to the CD workflow (cd.yml), which pushes it to ECR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for hours if a test process never exits.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No npm cache / npm ci: this app has zero dependencies and no
      # package-lock.json, so setup-node's cache step would fail to resolve.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep (JavaScript, Dockerfile, secrets)
        run: |
          # No --strict here: semgrep's Dockerfile parser cannot read the
          # multi-line LABEL / HEALTHCHECK in this Dockerfile (docker build
          # accepts them fine), and --strict would turn that parser warning
          # into a failed job. --error still fails on any real finding.
          semgrep scan --error \
            --config p/javascript --config p/dockerfile --config p/secrets .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  build:
    name: Build and scan image
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared config
        run: grep -E '^[A-Z_]+=' .github/config.env | tr -d '\r' >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$ECR_REPOSITORY:${{ github.sha }}" .

      - name: Smoke test container
        env:
          IMAGE: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker rm -f smoke

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scan-type: image
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

      # CD pushes exactly this tested image instead of rebuilding it. CD does not
      # check out the repo, so the config goes along (upload-artifact skips hidden paths).
      - name: Save image
        if: github.event_name != 'pull_request'
        run: |
          docker save "$ECR_REPOSITORY:${{ github.sha }}" | gzip > image.tar.gz
          cp .github/config.env config.env

      - name: Upload image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            image.tar.gz
            config.env
          retention-days: 1
