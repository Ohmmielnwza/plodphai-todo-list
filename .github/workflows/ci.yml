name: CI

# Single-app repository: every push is about this app, so no path filters.
# CI tests, scans and builds the image, pushes it to the ECR repository set in
# .github/config.env (tags: commit SHA and latest), then rolls it into the running
# EC2 instances — all on main only.
#
# การ rollout ที่นี่แตะแค่ "เครื่องรันอะไรอยู่" เท่านั้น ไม่ได้แตะรูปร่างของ infrastructure
# และไม่ได้แตะ launch template ด้วย มันทำแค่ 2 อย่าง:
#   1. เปลี่ยนค่า image tag ใน SSM Parameter Store
#   2. สั่ง start-instance-refresh ให้ ASG ทยอยสลับเครื่อง
# เครื่องใหม่บูตขึ้นมาอ่าน tag จาก SSM แล้ว docker pull ตัวนั้นมารัน
#
# ไม่มีการลบหรือสร้าง resource ใดๆ การวาง topology ทั้งชุดยังเป็นของ Infra Setup
# ที่ repo prodpai_cloud และ Launch Image ที่นั่นใช้ย้อน tag เก่าได้ด้วยกลไกเดียวกัน

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # ให้ผลสแกนขึ้นแท็บ Security ของ repo แทนที่จะจมอยู่ใน log ของ job
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for hours if a test process never exits.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No npm cache / npm ci: this app has zero dependencies and no
      # package-lock.json, so setup-node's cache step would fail to resolve.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

  lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trivy misconfig จับเรื่อง security ของ Dockerfile แต่ไม่จับเรื่องคุณภาพ
      # เช่น ไม่ปักเวอร์ชัน apt หรือเรียง layer ผิดจน cache ไม่ทำงาน
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks ต้องอ่านทุก commit ไม่ใช่แค่ไฟล์ปัจจุบัน
          fetch-depth: 0

      # Trivy secret สแกนแค่ working tree ความลับที่เคย commit แล้วลบออกทีหลังจะไม่เจอ
      # แต่มันยังอยู่ใน history และยังใช้งานได้อยู่ ถ้าไม่ได้เพิกถอน
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner --exit-code 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep (JavaScript, Dockerfile, secrets)
        run: |
          # No --strict here: semgrep's Dockerfile parser cannot read the
          # multi-line LABEL / HEALTHCHECK in this Dockerfile (docker build
          # accepts them fine), and --strict would turn that parser warning
          # into a failed job. --error still fails on any real finding.
          semgrep scan --error --sarif --output semgrep.sarif \
            --config p/javascript --config p/dockerfile --config p/secrets .

      # ผลจะขึ้นแท็บ Security ถ้า repo เปิด code scanning ไว้ ถ้ายังไม่เปิดก็ไม่ทำให้ job ตก
      - name: Upload Semgrep results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Trivy filesystem scan (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build:
    name: Build, scan and push image
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared config
        run: grep -E '^[A-Z_]+=' .github/config.env | tr -d '\r' >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$ECR_REPOSITORY:${{ github.sha }}" .

      - name: Smoke test container
        env:
          IMAGE: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker rm -f smoke

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scan-type: image
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

      # Everything below only runs for real main builds: a pull request is
      # tested and scanned, but nothing from it reaches the registry.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      # The exact image that was just tested and scanned, never a rebuild.
      - name: Push image to ECR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker tag "$ECR_REPOSITORY:$TAG" "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker tag "$ECR_REPOSITORY:$TAG" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          {
            echo "### Image pushed"
            echo ""
            echo "- \`$REGISTRY/$ECR_REPOSITORY:$TAG\`"
            echo "- \`$REGISTRY/$ECR_REPOSITORY:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollout:
    name: Roll the new image into the ASG
    needs: [build]
    # เฉพาะของจริงบน main เท่านั้น PR หรือการกด Run workflow จาก branch อื่นไม่แตะ production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # กันตัวเองซ้อนกันเอง ถ้า push ติดๆ กันหลายรอบ ให้รอรอบก่อนหน้าจบก่อน
    concurrency:
      group: prodpai-rollout
      cancel-in-progress: false
    env:
      TAG: ${{ github.sha }}
      # ป้ายประกาศที่เครื่องใน ASG อ่านตอนบูต สร้างโดย Terraform ฝั่ง infra (ssm.tf)
      IMAGE_TAG_PARAM: /prod-pai/app/image_tag
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the ASG
        id: find
        run: |
          asg=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'prod-pai-env-asg')].AutoScalingGroupName | [0]" \
            --output text)
          if [ "$asg" = "None" ] || [ -z "$asg" ]; then
            echo "::error::ยังไม่มี ASG — ต้องรัน Infra Setup ที่ repo prodpai_cloud ก่อนหนึ่งครั้ง"
            exit 1
          fi
          echo "asg=$asg" >> "$GITHUB_OUTPUT"

      # ยิงรอบใหม่ทับรอบที่ยังไม่จบจะโดนปฏิเสธ แล้วเครื่องจะค้างคาอยู่ครึ่งทาง
      # push ติดๆ กันเป็นเรื่องปกติ จึงรอให้รอบก่อนจบแทนที่จะ fail ทิ้ง
      - name: Wait for any running refresh to finish
        run: |
          for i in $(seq 1 40); do
            status=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ steps.find.outputs.asg }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            case "$status" in
              Pending|InProgress|Cancelling) echo "  รอรอบก่อนหน้า ($status)"; sleep 30 ;;
              *) echo "ว่างแล้ว (ล่าสุด: $status)"; exit 0 ;;
            esac
          done
          echo "::error::รอรอบก่อนหน้าไม่จบภายในเวลา"
          exit 1

      # 1. เปลี่ยนป้ายประกาศให้เป็นเวอร์ชันที่เพิ่ง push ขึ้น ECR
      - name: Update the image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "$IMAGE_TAG_PARAM" \
            --value "$TAG" \
            --type String \
            --overwrite >/dev/null
          echo "✅ $IMAGE_TAG_PARAM = $TAG"

      # 2. สะกิด ASG ให้ทยอยสลับเครื่อง เครื่องใหม่บูตมาอ่าน tag จาก SSM แล้ว pull ตัวนั้น
      #    ไม่แตะ launch template และไม่มีคำสั่งลบหรือสร้างเครื่องในนี้เลย
      - name: Trigger the rolling instance refresh
        run: |
          id=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ steps.find.outputs.asg }}" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}' \
            --query InstanceRefreshId --output text)
          echo "✅ instance refresh $id เริ่มแล้ว"

      - name: Wait for the rollout
        run: |
          asg="${{ steps.find.outputs.asg }}"
          sleep 20
          for i in $(seq 1 60); do
            info=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$asg" \
                     --query 'InstanceRefreshes[0].[Status,PercentageComplete]' --output text)
            status=$(echo "$info" | awk '{print $1}')
            pct=$(echo "$info" | awk '{print $2}')
            echo "  $status ${pct}%"
            case "$status" in
              Successful) echo "เครื่องทุกตัวรัน image ใหม่แล้ว"; exit 0 ;;
              Failed|Cancelled) echo "::error::instance refresh $status"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::warning::รอครบเวลาแล้วยังไม่จบ ไปดูต่อที่ ASG → Instance refresh"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rollout"
            echo ""
            echo "- ASG: \`${{ steps.find.outputs.asg }}\`"
            echo "- SSM: \`$IMAGE_TAG_PARAM\` = \`$TAG\`"
            echo ""
            echo "ASG ทยอยสลับเครื่องเองแบบ rolling (min healthy 50%, warmup 180s)"
            echo "เครื่องใหม่อ่าน tag จาก SSM ตอนบูตแล้ว docker pull ตัวนั้นมารัน"
            echo "ถ้าต้องย้อนกลับ ให้รัน **Launch Image** ที่ repo \`prodpai_cloud\` ด้วย tag เก่า"
          } >> "$GITHUB_STEP_SUMMARY"
